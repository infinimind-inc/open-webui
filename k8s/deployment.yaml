apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui-dev
  namespace: deepframe
  labels:
    app: open-webui
    env: dev
    run: open-webui-dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: open-webui
      env: dev
      run: open-webui-dev
  template:
    metadata:
      labels:
        app: open-webui
        env: dev
        run: open-webui-dev
    spec:
      containers:
        - name: open-webui
          image: 262740798135.dkr.ecr.us-east-2.amazonaws.com/deepframe/open-webui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: OPENAI_API_BASE_URLS
              value: "http://df-model-gemma4-31b-it-nvfp4-dev-predictor/v1;http://df-model-deepframe-dev-predictor/v1"
            - name: OPENAI_API_KEYS
              value: "local-dev-key;local-dev-key"
            - name: AUDIO_STT_SUPPORTED_CONTENT_TYPES
              value: "audio/*,video/webm,video/mp4"
            - name: CORS_ALLOW_ORIGIN
              value: "*"
          envFrom:
            - secretRef:
                name: open-webui-secret-dev
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data-dev
