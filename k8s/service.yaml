apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: deepframe
  labels:
    app: open-webui
    env: dev
    run: open-webui
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: df-open-webui
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: open-webui
    env: dev
    run: open-webui
