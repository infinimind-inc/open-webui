apiVersion: v1
kind: Secret
metadata:
  name: open-webui-secret
  namespace: deepframe
type: Opaque
data:
  # Base64-encoded value. Generate with:
  #   echo -n "your-secret-key" | base64
  # IMPORTANT: Do NOT commit real secrets to version control.
  # Use `kubectl create secret` or a secrets manager instead:
  #   kubectl create secret generic open-webui-secret \
  #     --namespace deepframe \
  #     --from-literal=WEBUI_SECRET_KEY="$(openssl rand -hex 32)"
  WEBUI_SECRET_KEY: "REPLACE_WITH_BASE64_ENCODED_SECRET"
